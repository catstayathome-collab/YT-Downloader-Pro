name: Build Windows 1.8.7 test artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-1.8.7.yml'
      - 'YT_downloader_187_windows.py'
      - 'ytdp/**'
      - 'scripts/build_windows_1_8_7.ps1'
      - 'scripts/check_windows_package.py'
      - 'scripts/fetch_windows_tools.py'
      - 'scripts/generate_windows_icon.py'
      - 'tools/windows-tools.json'
      - 'tools/licenses/**'
      - 'assets/AppIcon-1024.png'
      - 'README-Windows.txt'
      - 'THIRD_PARTY_NOTICES.md'
      - 'docs/WINDOWS_TEST_CHECKLIST.md'
      - 'requirements.txt'
      - 'tests/**'

jobs:
  build-windows:
    name: Build and verify Windows x64 package
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install exact requirements
        run: python -m pip install --requirement requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build Windows package
        shell: pwsh
        run: ./scripts/build_windows_1_8_7.ps1 -Python python

      - name: Verify the final ZIP from a clean extraction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageName = 'YT-Downloader-Pro-v1.8.7-Windows-x64'
          $distRoot = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $archivePath = Join-Path $distRoot "$packageName.zip"
          $sha256Path = "$archivePath.sha256"
          $originalSelfTest = Join-Path $distRoot 'windows-self-test.json'
          $extractedSelfTest = Join-Path $distRoot 'windows-extracted-self-test.json'
          $packageReport = Join-Path $distRoot 'windows-package-report.json'
          $extractionRoot = Join-Path $env:RUNNER_TEMP "yt-downloader-pro-extracted-$([guid]::NewGuid())"

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash.ToLowerInvariant()
          "$hash *$([System.IO.Path]::GetFileName($archivePath))" | Set-Content -LiteralPath $sha256Path -NoNewline

          New-Item -ItemType Directory -Path $extractionRoot | Out-Null
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractionRoot
          $packageRoot = Join-Path $extractionRoot $packageName
          python scripts/check_windows_package.py $packageRoot | Tee-Object -FilePath $packageReport
          if ($LASTEXITCODE -ne 0) { throw 'Extracted Windows package failed the static check.' }

          $extractedExe = Join-Path $packageRoot 'YT Downloader Pro.exe'
          & $extractedExe --self-test --self-test-report $extractedSelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Extracted Windows executable self-test failed.' }

          foreach ($reportPath in @($originalSelfTest, $extractedSelfTest)) {
            if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
              throw "Missing self-test report: $reportPath"
            }
            $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
            if ($report.status -ne 'ok') {
              throw "Self-test did not report status ok: $reportPath"
            }
          }

      - name: Upload verified Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader-Pro-v1.8.7-Windows-x64
          if-no-files-found: error
          path: |
            dist/YT-Downloader-Pro-v1.8.7-Windows-x64.zip
            dist/YT-Downloader-Pro-v1.8.7-Windows-x64.zip.sha256
            dist/windows-self-test.json
            dist/windows-extracted-self-test.json
            dist/windows-package-report.json
            tools/windows-tools.json
